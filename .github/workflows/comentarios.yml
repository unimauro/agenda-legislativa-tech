name: Comentarios ciudadanos
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  discussion_comment:
    types: [created]
permissions:
  contents: write
  discussions: read
concurrency: comentarios
jobs:
  trazar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_comentarios.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit si cambió
        run: |
          git diff --quiet data/comentarios.json && exit 0
          git config user.name "Carlos Cárdenas"
          git config user.email unimauro@gmail.com
          git add data/comentarios.json
          git commit -m "chore(comentarios): refresco $(date -u +%F)"
          git push
