name: Participación ciudadana
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  discussion_comment:
    types: [created]
  issues:
    types: [opened, labeled, unlabeled, edited, closed, reopened]
permissions:
  contents: write
  discussions: read
  issues: read
concurrency: participacion
jobs:
  trazar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 scripts/build_comentarios.py
          python3 scripts/build_ciudadanas.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit si cambió
        run: |
          git diff --quiet data/comentarios.json data/ciudadanas.json && exit 0
          git config user.name "Carlos Cárdenas"
          git config user.email unimauro@gmail.com
          git add data/comentarios.json data/ciudadanas.json
          git commit -m "chore(participación): refresco $(date -u +%F)"
          git pull --rebase -q && git push
